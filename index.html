<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Návštěvní test">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>PWA Test V2</title>
  <style>
    /* Základní styl pro podpisové plátno */
    #sig-canvas {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      touch-action: none; /* Důležité pro Safari: zabrání scrollování stránky při kreslení */
      background: #ffffff;
      cursor: crosshair;
      width: 100%;
      max-width: 400px;
      height: 150px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>📖 Návštěvní kniha – TEST V2</h1>
  <div class="status" id="mode">Načítám…</div>
  
  <div class="card">
    <label for="event">Událost</label>
    <select id="event">
      <option>Zásilka</option>
      <option>Servis</option>
      <option>Abholer</option>
      <option>Návštěva</option>
    </select>
    
    <label for="name">Jméno</label>
    <input id="name" placeholder="Sem napiš jméno">
    
    <label for="note">Poznámka</label>
    <textarea id="note" rows="3" placeholder="Rozpracovaný text..."></textarea>
  </div>

  <!-- Přidaná sekce pro podpis -->
  <div class="card">
    <h3>Podpis</h3>
    <canvas id="sig-canvas"></canvas>
    <br>
    <button id="clear-sig" class="secondary" style="margin-top: 8px;">Vymazat podpis</button>
  </div>

  <div class="card">
    <h3>Stav aplikace</h3>
    <p>Počet kliknutí: <span id="count">0</span></p>
    <button id="plus">+1 klik</button>
    <button id="clear" class="secondary">Reset</button>
  </div>

  <div class="card">
    <h3>Testovací ID</h3>
    <p id="session"></p>
    <p id="saved"></p>
  </div>
</div>

<script>
  // Explicitní načtení prvků pro 100% kompatibilitu s iOS Safari
  const elMode = document.getElementById('mode');
  const elEvent = document.getElementById('event');
  const elName = document.getElementById('name');
  const elNote = document.getElementById('note');
  const elCount = document.getElementById('count');
  const elPlus = document.getElementById('plus');
  const elClear = document.getElementById('clear');
  const elSession = document.getElementById('session');
  const elSaved = document.getElementById('saved');
  
  const canvas = document.getElementById('sig-canvas');
  const elClearSig = document.getElementById('clear-sig');
  const ctx = canvas.getContext('2d');

  // Detekce Standalone režimu
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  elMode.textContent = isStandalone ? "✅ STANDALONE – vlastní okno" : "⚠️ Běží v Safari";

  const K = 'pwa-test-v2';
  let st = JSON.parse(localStorage.getItem(K) || JSON.stringify({
    count: 0,
    event: "Zásilka",
    name: "",
    note: "",
    session: crypto.randomUUID()
  }));

  function render() {
    elEvent.value = st.event;
    elName.value = st.name;
    elNote.value = st.note;
    elCount.textContent = st.count;
    elSession.textContent = 'ID: ' + st.session;
    elSaved.textContent = 'Uloženo: ' + new Date().toLocaleTimeString('cs-CZ');
    localStorage.setItem(K, JSON.stringify(st));
  }

  // Event Listenery pro formulářové prvky
  [elEvent, elName, elNote].forEach(el => {
    el.addEventListener('input', e => {
      st[e.target.id] = e.target.value;
      render();
    });
  });

  // Event Listenery pro tlačítka
  elPlus.addEventListener('click', () => {
    st.count++;
    render();
  });

  elClear.addEventListener('click', () => {
    if (confirm("Resetovat test?")) {
      localStorage.removeItem(K);
      location.reload();
    }
  });

  // --- Logika kreslení podpisu (Touch + Mouse support) ---
  let isDrawing = false;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#0f172a';
  }

  // Nastavení rozlišení plátna
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    isDrawing = false;
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);

  canvas.addEventListener('touchstart', startDrawing, { passive: true });
  canvas.addEventListener('touchmove', draw, { passive: true });
  canvas.addEventListener('touchend', stopDrawing);

  elClearSig.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  // Počáteční vykreslení
  render();
</script>
</body>
</html>
