<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Návštěvní test">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>PWA Test V2</title>
  <style>
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .lang-picker {
      display: flex;
      gap: 8px;
    }
    .lang-btn {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 1.4rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.1s, border-color 0.2s;
    }
    .lang-btn:active {
      transform: scale(0.92);
    }
    .lang-btn.active {
      border-color: #38bdf8;
      background: #0f172a;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    #sig-canvas {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      touch-action: none;
      background: #ffffff;
      cursor: crosshair;
      width: 100%;
      max-width: 400px;
      height: 150px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    /* Blok pro bezpečnostní pravidla */
    .terms-card {
      max-height: 45vh;
      overflow-y: auto;
      line-height: 1.5;
      font-size: 0.9rem;
    }
    .terms-card ul {
      padding-left: 20px;
      margin: 10px 0;
    }
    .terms-card li {
      margin-bottom: 8px;
    }
    
    /* Styl pro formální prohlášení na samostatném řádku */
    .declaration-text {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #334155;
      font-weight: 600;
      font-style: italic;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header-bar">
    <h1 id="t-title" style="margin:0;">📖 Návštěvní kniha</h1>
    <div class="lang-picker">
      <button class="lang-btn" data-lang="de" title="Deutsch">🇩🇪</button>
      <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
      <button class="lang-btn" data-lang="cz" title="Čeština">🇨🇿</button>
      <button class="lang-btn" data-lang="ro" title="Română">🇷🇴</button>
    </div>
  </div>
  
  <!-- KARTA 1: Po kliknutí na Dále se zcela skryje -->
  <div id="step-one-container" class="card">
    <label id="t-lbl-event" for="event">Účel návštěvy</label>
    <select id="event">
      <option value="Zásilka" id="t-opt-shipment">Zásilka</option>
      <option value="Servis" id="t-opt-service">Servis</option>
      <option value="Abholer" id="t-opt-pickup">Odběr / Abholer</option>
      <option value="Návštěva" id="t-opt-visit">Návštěva</option>
    </select>
    
    <label id="t-lbl-name" for="name">Jméno</label>
    <input id="name" placeholder="...">
    
    <label id="t-lbl-note" for="note">Poznámka (volitelné)</label>
    <textarea id="note" rows="3" placeholder="..."></textarea>
    
    <div class="btn-group">
      <button id="reset-form" class="secondary">Resetovat formulář</button>
      <button id="btn-next">Dále</button>
    </div>
  </div>

  <!-- KARTA 2: Výchozí skrytá -->
  <div id="step-two-container" class="hidden">
    
    <!-- Bezpečnostní pravidla EXPRESLog -->
    <div class="card terms-card">
      <h3 id="t-h3-terms">Bezpečnostní pravidla pro pohyb na provozní ploše (Spedice EXPRESLog)</h3>
      <ul id="t-rules-list">
        <!-- Pravidla se dynamicky vkládají z JS -->
      </ul>
      <p id="t-declaration" class="declaration-text"></p>
    </div>

    <div class="card">
      <h3 id="t-h3-signature">Podpis</h3>
      <canvas id="sig-canvas"></canvas>
      <div class="btn-group">
        <button id="clear-sig" class="secondary">Vymazat podpis</button>
      </div>
    </div>

    <div class="card">
      <h3 id="t-h3-appstatus">Stav aplikace</h3>
      <p><span id="t-txt-clicks">Počet kliknutí:</span> <span id="count">0</span></p>
      <div class="btn-group">
        <button id="plus">+1 klik</button>
        <button id="reset-counter" class="secondary">Reset čítače</button>
      </div>
    </div>

    <div class="card">
      <h3 id="t-h3-testid">Testovací ID</h3>
      <p id="session"></p>
      <p id="saved"></p>
    </div>

  </div>
</div>

<script>
  const translations = {
    cz: {
      title: "📖 Návštěvní kniha – TEST V2",
      lblEvent: "Účel návštěvy",
      optShipment: "Zásilka",
      optService: "Servis",
      optPickup: "Odběr / Abholer",
      optVisit: "Návštěva",
      lblName: "Jméno",
      phName: "Sem napiš jméno",
      lblNote: "Poznámka (volitelné)",
      phNote: "Rozpracovaný text...",
      btnResetForm: "Resetovat formulář",
      btnNext: "Dále",
      h3Terms: "Bezpečnostní pravidla pro pohyb na provozní ploše (Spedice EXPRESLog)",
      rules: [
        "<strong>Reflexní vesta:</strong> Vstup na provozní plochu je povolen pouze v reflexní vestě s vysokou viditelností (třída 2 nebo vyšší).",
        "<strong>Bezpečnostní obuv:</strong> Všichni pracovníci i návštěvníci musí nosit uzavřenou bezpečnostní obuv s ocelovou nebo kompozitní špičkou a protiskluzovou podrážkou.",
        "<strong>Vyznačené koridory:</strong> Pro pěší pohyb využívejte výhradně zeleně vyznačené chodníky a přechody. Je přísně zakázáno zkracovat si cestu přes manipulativní zóny.",
        "<strong>Přednost v jízdě:</strong> Manipulační technika (vysokozdvižné vozíky, tahače) a nákladní automobily mají vždy přednost před pěšími.",
        "<strong>Oční kontakt:</strong> Než vstoupíte do dráhy vozidla nebo vysokozdvižného vozíku, vždy navažte přímý oční kontakt s řidičem a vyčkejte, až vás zaznamená.",
        "<strong>Zákaz mobilních telefonů:</strong> Na provozní ploše je přísně zakázáno používat mobilní telefony, sluchátka nebo provádět jakékoli jiné činnosti odvádějící pozornost.",
        "<strong>Sledování slepých úhlů:</strong> Při obcházení zaparkovaných kamionů, kontejnerů a v rozích budov dbejte zvýšené opatrnosti a udržujte dostatečný odstup od slepých úhlů.",
        "<strong>Používání ochranné přilby:</strong> V zónách s rizikem pádu břemene nebo při nakládce/vykládce ve výškách je povinné nosit ochrannou přilbu.",
        "<strong>Zákaz vstupu pod břemeno:</strong> Je přísně zakázáno vstupovat pod zavěšená břemena nebo se zdržovat v těsné blízkosti zvedacího mechanizmu techniky.",
        "<strong>Ohlášení nebezpečí a úrazů:</strong> Jakékoli poškození infrastruktury, rozlité provozní kapaliny nebo „skoronehody“ okamžitě nahlaste vedoucímu směny."
      ],
      declaration: "Podpisem stvrzuji, že jsem se s těmito bezpečnostními pravidly řádně seznámil/a a zavazuji se k jejich bezvýhradnému dodržování.",
      h3Sig: "Podpis",
      btnClearSig: "Vymazat podpis",
      h3AppStatus: "Stav aplikace",
      txtClicks: "Počet kliknutí:",
      btnPlus: "+1 klik",
      btnResetCounter: "Reset čítače",
      h3TestId: "Testovací ID",
      lblSaved: "Uloženo:"
    },
    en: {
      title: "📖 Visitor Logbook – TEST V2",
      lblEvent: "Purpose of visit",
      optShipment: "Shipment",
      optService: "Service",
      optPickup: "Pickup",
      optVisit: "Visit",
      lblName: "Name",
      phName: "Enter name here",
      lblNote: "Note (optional)",
      phNote: "Draft text...",
      btnResetForm: "Reset Form",
      btnNext: "Next",
      h3Terms: "Safety Rules for Operating Area (EXPRESLog Freight)",
      rules: [
        "<strong>High-Visibility Vest:</strong> Entry is permitted only with a high-visibility vest (Class 2 or higher).",
        "<strong>Safety Footwear:</strong> Closed safety shoes with steel or composite toecaps and anti-slip soles are mandatory.",
        "<strong>Designated Walkways:</strong> Use green-marked pedestrian paths only. Shortening routes across handling zones is prohibited.",
        "<strong>Right of Way:</strong> Handling equipment (forklifts, tuggers) and trucks always have priority over pedestrians.",
        "<strong>Eye Contact:</strong> Always establish direct eye contact with drivers before crossing their path.",
        "<strong>No Mobile Phones:</strong> Using mobile phones or headphones in operating areas is strictly forbidden.",
        "<strong>Blind Spots:</strong> Pay extra attention around parked trucks, containers, and building corners.",
        "<strong>Hard Hats:</strong> Helmets are required in areas with overhead load hazards or high unloading.",
        "<strong>Suspended Loads:</strong> Never walk under suspended loads or stay near lifting mechanisms.",
        "<strong>Report Hazards:</strong> Immediately report damages, fluid spills, or near-misses to the shift supervisor."
      ],
      declaration: "By signing below, I confirm that I have read and understood these safety rules and agree to strictly comply with them.",
      h3Sig: "Signature",
      btnClearSig: "Clear Signature",
      h3AppStatus: "App Status",
      txtClicks: "Click count:",
      btnPlus: "+1 click",
      btnResetCounter: "Reset Counter",
      h3TestId: "Test ID",
      lblSaved: "Saved:"
    },
    de: {
      title: "📖 Besucherbuch – TEST V2",
      lblEvent: "Besuchszweck",
      optShipment: "Lieferung",
      optService: "Service",
      optPickup: "Abholer",
      optVisit: "Besuch",
      lblName: "Name",
      phName: "Name hier eingeben",
      lblNote: "Notiz (optional)",
      phNote: "Entwurfstext...",
      btnResetForm: "Formular zurücksetzen",
      btnNext: "Weiter",
      h3Terms: "Sicherheitsregeln für den Betriebsbereich (EXPRESLog)",
      rules: [
        "<strong>Warnweste:</strong> Zutritt nur mit Hochsicherheits-Warnweste (Klasse 2 oder höher) gestattet.",
        "<strong>Sicherheitsschuhe:</strong> Geschlossene Sicherheitsschuhe mit Zehenschutzkappe und rutschfester Sohle sind Pflicht.",
        "<strong>Markierte Wege:</strong> Nutzen Sie ausschließlich die grün markierten Fußwege. Abkürzungen sind verboten.",
        "<strong>Vorfahrt:</strong> Flurförderzeuge (Gabelstapler) und LKW haben stets Vorrang vor Fußgängern.",
        "<strong>Blickkontakt:</strong> Suchen Sie immer direkten Blickkontakt zum Fahrer, bevor Sie dessen Fahrspur kreuzen.",
        "<strong>Handyverbot:</strong> Die Nutzung von Mobiltelefonen oder Kopfhörern im Betriebsbereich ist strengstens untersagt.",
        "<strong>Toter Winkel:</strong> Achten Sie besonders auf tote Winkel bei geparkten LKW, Containern und Gebäudeecken.",
        "<strong>Schutzhelm:</strong> Helm-Pflicht in Zonen mit Kranbetrieb oder Überkopfbeladung.",
        "<strong>Schwebende Lasten:</strong> Das Betreten von Bereichen unter schwebenden Lasten ist verboten.",
        "<strong>Meldepflicht:</strong> Schäden, ausgelaufene Flüssigkeiten oder Beinahe-Unfälle sofort dem Schichtleiter melden."
      ],
      declaration: "Mit meiner Unterschrift bestätige ich, dass ich diese Sicherheitsregeln zur Kenntnis genommen habe und mich zu deren uneingeschränkter Einhaltung verpflichte.",
      h3Sig: "Unterschrift",
      btnClearSig: "Unterschrift löschen",
      h3AppStatus: "App-Status",
      txtClicks: "Klickanzahl:",
      btnPlus: "+1 Klick",
      btnResetCounter: "Zähler zurücksetzen",
      h3TestId: "Test-ID",
      lblSaved: "Gespeichert:"
    },
    ro: {
      title: "📖 Registru Vizitatori – TEST V2",
      lblEvent: "Scopul vizitei",
      optShipment: "Livrare",
      optService: "Service",
      optPickup: "Ridicare",
      optVisit: "Vizită",
      lblName: "Nume",
      phName: "Introduceți numele",
      lblNote: "Notă (opțional)",
      phNote: "Text în lucru...",
      btnResetForm: "Resetează formularul",
      btnNext: "Mai departe",
      h3Terms: "Reguli de siguranță pentru zona operațională (EXPRESLog)",
      rules: [
        "<strong>Vestă reflectorizantă:</strong> Accesul este permis doar cu vestă reflectorizantă (Clasa 2 sau mai înaltă).",
        "<strong>Încălțăminte de protecție:</strong> Încălțămintea închisă cu bombeu metalic și talpă antiderapantă este obligatorie.",
        "<strong>Culoare desemnate:</strong> Folosiți exclusiv traseele pietonale marcate cu verde.",
        "<strong>Prioritate de trecere:</strong> Stivuitoarele și camioanele au întotdeauna prioritate față de pietoni.",
        "<strong>Contact vizual:</strong> Stabiliți întotdeauna contact vizual cu șoferul înainte de a-i tăia calea.",
        "<strong>Interzis telefoanele:</strong> Utilizarea telefoanelor sau căștilor în zona operațională este strict interzisă.",
        "<strong>Unghiuri moarte:</strong> Fiți foarte atenți în jurul camioanelor parcate, containerelor și colțurilor clădirilor.",
        "<strong>Cască de protecție:</strong> Casca este obligatorie în zonele cu risc de cădere a obiectelor.",
        "<strong>Sarcini suspendate:</strong> Este interzis accesul sub sarcinile suspendate ale echipamentelor.",
        "<strong>Raportare pericole:</strong> Raportați imediat șefului de schimb orice daună, scurgere sau incident."
      ],
      declaration: "Prin semnătură, confirm că am citit și am înțeles aceste reguli de siguranță și mă oblig să le respect cu strictețe.",
      h3Sig: "Semnătură",
      btnClearSig: "Șterge semnătura",
      h3AppStatus: "Stare aplicație",
      txtClicks: "Număr de clicuri:",
      btnPlus: "+1 clic",
      btnResetCounter: "Resetează contorul",
      h3TestId: "ID Test",
      lblSaved: "Salvat:"
    }
  };

  const elEvent = document.getElementById('event');
  const elName = document.getElementById('name');
  const elNote = document.getElementById('note');
  const elCount = document.getElementById('count');
  const elPlus = document.getElementById('plus');
  const elResetCounter = document.getElementById('reset-counter');
  const elResetForm = document.getElementById('reset-form');
  const elBtnNext = document.getElementById('btn-next');
  const elSession = document.getElementById('session');
  const elSaved = document.getElementById('saved');
  const canvas = document.getElementById('sig-canvas');
  const elClearSig = document.getElementById('clear-sig');
  const elStepOne = document.getElementById('step-one-container');
  const elStepTwo = document.getElementById('step-two-container');
  const elRulesList = document.getElementById('t-rules-list');
  const elDeclaration = document.getElementById('t-declaration');
  const ctx = canvas.getContext('2d');

  const K = 'pwa-test-v2';
  let st = JSON.parse(localStorage.getItem(K) || JSON.stringify({
    count: 0,
    event: "Zásilka",
    name: "",
    note: "",
    lang: "de",
    session: crypto.randomUUID()
  }));

  function applyLanguage(lang) {
    const t = translations[lang] || translations.de;
    document.getElementById('t-title').textContent = t.title;
    document.getElementById('t-lbl-event').textContent = t.lblEvent;
    document.getElementById('t-opt-shipment').textContent = t.optShipment;
    document.getElementById('t-opt-service').textContent = t.optService;
    document.getElementById('t-opt-pickup').textContent = t.optPickup;
    document.getElementById('t-opt-visit').textContent = t.optVisit;
    document.getElementById('t-lbl-name').textContent = t.lblName;
    elName.placeholder = t.phName;
    document.getElementById('t-lbl-note').textContent = t.lblNote;
    elNote.placeholder = t.phNote;
    elResetForm.textContent = t.btnResetForm;
    elBtnNext.textContent = t.btnNext;
    
    // Pravidla a Prohlášení
    document.getElementById('t-h3-terms').textContent = t.h3Terms;
    elRulesList.innerHTML = t.rules.map(r => `<li>${r}</li>`).join('');
    elDeclaration.textContent = t.declaration;

    document.getElementById('t-h3-signature').textContent = t.h3Sig;
    elClearSig.textContent = t.btnClearSig;
    document.getElementById('t-h3-appstatus').textContent = t.h3AppStatus;
    document.getElementById('t-txt-clicks').textContent = t.txtClicks;
    elPlus.textContent = t.btnPlus;
    elResetCounter.textContent = t.btnResetCounter;
    document.getElementById('t-h3-testid').textContent = t.h3TestId;

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
  }

  function render() {
    elEvent.value = st.event;
    elName.value = st.name;
    elNote.value = st.note;
    elCount.textContent = st.count;
    elSession.textContent = 'ID: ' + st.session;
    
    const t = translations[st.lang] || translations.de;
    elSaved.textContent = t.lblSaved + ' ' + new Date().toLocaleTimeString();
    
    applyLanguage(st.lang);
    localStorage.setItem(K, JSON.stringify(st));
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      st.lang = btn.dataset.lang;
      render();
    });
  });

  [elEvent, elName, elNote].forEach(el => {
    el.addEventListener('input', e => {
      st[e.target.id] = e.target.value;
      render();
    });
  });

  elPlus.addEventListener('click', () => {
    st.count++;
    render();
  });

  elResetCounter.addEventListener('click', () => {
    st.count = 0;
    render();
  });

  elResetForm.addEventListener('click', () => {
    st.event = "Zásilka";
    st.name = "";
    st.note = "";
    render();
  });

  elBtnNext.addEventListener('click', () => {
    elStepOne.classList.add('hidden');
    elStepTwo.classList.remove('hidden');
    
    resizeCanvas();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // --- Kreslení podpisu ---
  let isDrawing = false;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    if(rect.width > 0) {
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';
    }
  }

  window.addEventListener('resize', resizeCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    isDrawing = false;
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);

  canvas.addEventListener('touchstart', startDrawing, { passive: true });
  canvas.addEventListener('touchmove', draw, { passive: true });
  canvas.addEventListener('touchend', stopDrawing);

  elClearSig.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  render();
</script>
</body>
</html>
