<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#002b1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Besucherbuch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Besucherbuch</title>
  <style>
    body {
      background-color: #002b1a;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 16px;
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 10px;
    }
    .brand-logo {
      max-width: 240px;
      height: auto;
      display: inline-block;
    }

    .lang-picker {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: nowrap;
    }
    .lang-btn {
      background: #003822;
      border: 1px solid #005c38;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, border-color 0.2s, background-color 0.2s;
    }
    .lang-btn img {
      width: 24px;
      height: 16px;
      object-fit: cover;
      border-radius: 2px;
      display: block;
      pointer-events: none;
    }
    .lang-btn:active {
      transform: scale(0.92);
    }
    .lang-btn.active {
      border-color: #22c55e;
      background: #001f13;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    .card {
      background: #003822;
      border: 1px solid #005c38;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #005c38;
      background: #002215;
      color: #ffffff;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      background-color: #10b981;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #059669;
    }
    button.secondary {
      background-color: transparent;
      border: 1px solid #005c38;
      color: #cbd5e1;
    }

    #sig-canvas {
      border: 2px dashed #005c38;
      border-radius: 8px;
      touch-action: none;
      background: #ffffff;
      cursor: crosshair;
      width: 100%;
      max-width: 400px;
      height: 150px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .custom-option-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 12px;
    }
    .custom-option-group input {
      flex: 1;
    }

    .hidden {
      display: none !important;
    }

    .terms-card {
      max-height: 45vh;
      overflow-y: auto;
      line-height: 1.5;
      font-size: 0.9rem;
    }
    .terms-card ul {
      padding-left: 20px;
      margin: 10px 0;
    }
    .terms-card li {
      margin-bottom: 8px;
    }

    .sig-declaration {
      font-size: 0.9rem;
      color: #f87171;
      font-weight: bold;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 8px;
      font-weight: 600;
    }
    .input-error {
      border: 2px solid #ef4444 !important;
    }

    .success-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background-color: #22c55e;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 12px;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
<div class="wrap">

  <!-- LOGO A VLAJKY POD LOGEM -->
  <div class="logo-container">
    <img src="Tradisa-logo-bl.png" alt="Tradisa Logo" class="brand-logo">
    
    <div class="lang-picker">
      <button class="lang-btn" data-lang="de" title="Deutsch">
        <img src="de.svg" alt="DE">
      </button>
      <button class="lang-btn" data-lang="en" title="English">
        <img src="gb.svg" alt="EN">
      </button>
      <button class="lang-btn" data-lang="cz" title="Čeština">
        <img src="cz.svg" alt="CZ">
      </button>
      <button class="lang-btn" data-lang="hu" title="Magyar">
        <img src="hu.svg" alt="HU">
      </button>
      <button class="lang-btn" data-lang="pl" title="Polski">
        <img src="pl.svg" alt="PL">
      </button>
      <button class="lang-btn" data-lang="ro" title="Română">
        <img src="ro.svg" alt="RO">
      </button>
      <button class="lang-btn" data-lang="ru" title="Русский">
        <img src="ru.svg" alt="RU">
      </button>
    </div>
  </div>
  
  <!-- KARTA 1 -->
  <div id="step-one-container" class="card">
    <label id="t-lbl-event" for="event">Besuchszweck</label>
    <select id="event">
      <option value="" id="t-opt-select">-- Besuchszweck auswählen --</option>
      <option value="Lieferung" id="t-opt-shipment">Lieferung</option>
      <option value="Service" id="t-opt-service">Service</option>
      <option value="Abholer" id="t-opt-pickup">Abholer</option>
      <option value="Besuch" id="t-opt-visit">Besuch</option>
      <option value="Andere Option" id="t-opt-other">Andere Option</option>
    </select>

    <div id="custom-event-container" class="custom-option-group hidden">
      <input id="custom-event" placeholder="Geben Sie den Zweck ein...">
      <button id="btn-save-custom" class="secondary" type="button">Speichern</button>
    </div>
    
    <label id="t-lbl-name" for="name" style="margin-top: 12px; display: block;">Vor- und Nachname</label>
    <input id="name" placeholder="Max Mustermann">
    
    <div id="validation-error" class="error-msg hidden"></div>

    <div class="btn-group">
      <button id="reset-form" class="secondary">Formular zurücksetzen</button>
      <button id="btn-next">Weiter</button>
    </div>
  </div>

  <!-- KARTA 2 -->
  <div id="step-two-container" class="hidden">
    
    <div class="card terms-card">
      <h3 id="t-h3-terms">Sicherheitsregeln für den Betriebsbereich (EXPRESLog)</h3>
      <ul id="t-rules-list"></ul>
    </div>

    <div class="card">
      <h3 id="t-h3-signature">Unterschrift</h3>
      
      <div id="sig-form-wrapper">
        <p id="t-sig-declaration" class="sig-declaration"></p>
        <canvas id="sig-canvas"></canvas>
        <div id="sig-error" class="error-msg hidden"></div>
        <div class="btn-group">
          <button id="clear-sig" class="secondary">Unterschrift löschen</button>
          <button id="confirm-sig">Bestätigen & Absenden</button>
        </div>
      </div>

      <div id="success-message" class="success-box hidden">
        <div class="success-icon">✓</div>
        <h3 id="t-success-title" style="margin: 0 0 8px 0; color: #22c55e;">Vielen Dank!</h3>
        <p id="t-success-text" style="margin: 0 0 16px 0; color: #cbd5e1; font-size: 0.9rem;"></p>
        <button id="btn-new-visitor" class="primary">Neuer Besucher</button>
      </div>

    </div>

  </div>
</div>

      btnClearSig: "Очистить подпись",
      btnConfirmSig: "Отправить и подтвердить",
      successTitle: "Спасибо!",
      successText: "Ваша подпись и согласие с правилами успешно зарегистрированы.",

  };

  const elEvent = document.getElementById('event');
  const elCustomEventContainer = document.getElementById('custom-event-container');
  const elCustomEvent = document.getElementById('custom-event');
  const elBtnSaveCustom = document.getElementById('btn-save-custom');
  const elName = document.getElementById('name');
  const elResetForm = document.getElementById('reset-form');
  const elBtnNext = document.getElementById('btn-next');
  const canvas = document.getElementById('sig-canvas');
  const elClearSig = document.getElementById('clear-sig');
  const elConfirmSig = document.getElementById('confirm-sig');
  const elSigDeclaration = document.getElementById('t-sig-declaration');
  const elSigError = document.getElementById('sig-error');
  const elStepOne = document.getElementById('step-one-container');
  const elStepTwo = document.getElementById('step-two-container');
  const elRulesList = document.getElementById('t-rules-list');
  const elValError = document.getElementById('validation-error');
  const elSigFormWrapper = document.getElementById('sig-form-wrapper');
  const elSuccessMessage = document.getElementById('success-message');
  const elBtnNewVisitor = document.getElementById('btn-new-visitor');
  const ctx = canvas.getContext('2d');

  const K = 'pwa-test-v2';
  
  let st = JSON.parse(localStorage.getItem(K) || JSON.stringify({
    event: "",
    customEvent: "",
    name: "",
    lang: "de"
  }));

  function applyLanguage(lang) {
    const t = translations[lang] || translations.de;
    
    document.title = t.title;
    
    document.getElementById('t-lbl-event').textContent = t.lblEvent;
    document.getElementById('t-opt-select').textContent = t.optSelect;
    document.getElementById('t-opt-shipment').textContent = t.optShipment;
    document.getElementById('t-opt-service').textContent = t.optService;
    document.getElementById('t-opt-pickup').textContent = t.optPickup;
    document.getElementById('t-opt-visit').textContent = t.optVisit;
    document.getElementById('t-opt-other').textContent = t.optOther;
    elCustomEvent.placeholder = t.phCustomEvent;
    elBtnSaveCustom.textContent = t.btnSaveCustom;

    document.getElementById('t-lbl-name').textContent = t.lblName;
    elName.placeholder = t.phName;
    elResetForm.textContent = t.btnResetForm;
    elBtnNext.textContent = t.btnNext;
    
    document.getElementById('t-h3-terms').textContent = t.h3Terms;
    elRulesList.innerHTML = t.rules.map(r => `<li>${r}</li>`).join('');

    document.getElementById('t-h3-signature').textContent = t.h3Sig;
    elSigDeclaration.textContent = t.sigDeclaration;
    elClearSig.textContent = t.btnClearSig;
    elConfirmSig.textContent = t.btnConfirmSig;
    document.getElementById('t-success-title').textContent = t.successTitle;
    document.getElementById('t-success-text').textContent = t.successText;
    elBtnNewVisitor.textContent = t.btnNewVisitor;

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
  }

  function render() {
    elEvent.value = st.event;
    elCustomEvent.value = st.customEvent || "";
    elName.value = st.name;
    
    if (st.event === "Andere Option" || st.event === "Jiná volba" || st.event === "Other option") {
      elCustomEventContainer.classList.remove('hidden');
    } else {
      elCustomEventContainer.classList.add('hidden');
    }

    applyLanguage(st.lang);
    localStorage.setItem(K, JSON.stringify(st));
  }

  function resetFullForm() {
    st.event = "";
    st.customEvent = "";
    st.name = "";
    st.lang = "de"; // Vždy resetovat zpět do výchozí němčiny
    
    elValError.classList.add('hidden');
    elSigError.classList.add('hidden');
    elEvent.classList.remove('input-error');
    elCustomEvent.classList.remove('input-error');
    elName.classList.remove('input-error');

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    elSigFormWrapper.classList.remove('hidden');
    elSuccessMessage.classList.add('hidden');
    elStepTwo.classList.add('hidden');
    elStepOne.classList.remove('hidden');

    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      st.lang = btn.dataset.lang;
      render();
    });
  });

  elEvent.addEventListener('change', e => {
    st.event = e.target.value;
    elCustomEvent.classList.remove('input-error');
    render();
  });

  elCustomEvent.addEventListener('input', e => {
    st.customEvent = e.target.value;
    render();
  });

  elBtnSaveCustom.addEventListener('click', () => {
    const t = translations[st.lang] || translations.de;
    if (elCustomEvent.value.trim() === "") {
      elCustomEvent.classList.add('input-error');
      elValError.textContent = t.errCustomEvent;
      elValError.classList.remove('hidden');
    } else {
      elCustomEvent.classList.remove('input-error');
      elValError.classList.add('hidden');
      render();
    }
  });

  elName.addEventListener('input', e => {
    st.name = e.target.value;
    render();
  });

  elResetForm.addEventListener('click', resetFullForm);
  elBtnNewVisitor.addEventListener('click', resetFullForm);

  elBtnNext.addEventListener('click', () => {
    const t = translations[st.lang] || translations.de;
    
    let isEventValid = elEvent.value.trim() !== "";
    let isCustomValid = true;

    if (elEvent.value === "Andere Option" || elEvent.value === "Jiná volba" || elEvent.value === "Other option") {
      isCustomValid = elCustomEvent.value.trim() !== "";
    }

    const words = elName.value.trim().split(/\s+/).filter(w => w.length > 0);
    const isNameValid = words.length >= 2;

    elEvent.classList.remove('input-error');
    elCustomEvent.classList.remove('input-error');
    elName.classList.remove('input-error');
    elValError.classList.add('hidden');

    if (!isEventValid || !isCustomValid || !isNameValid) {
      if (!isEventValid) elEvent.classList.add('input-error');
      if (!isCustomValid) elCustomEvent.classList.add('input-error');
      if (!isNameValid) elName.classList.add('input-error');

      if (!isEventValid) {
        elValError.textContent = t.errSelect;
      } else if (!isCustomValid) {
        elValError.textContent = t.errCustomEvent;
      } else if (!isNameValid) {
        elValError.textContent = t.errName;
      }

      elValError.classList.remove('hidden');
      return;
    }

    elStepOne.classList.add('hidden');
    elStepTwo.classList.remove('hidden');
    
    resizeCanvas();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  let isDrawing = false;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    if(rect.width > 0) {
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';
    }
  }

  window.addEventListener('resize', resizeCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    elSigError.classList.add('hidden');
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    isDrawing = false;
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);

  canvas.addEventListener('touchstart', startDrawing, { passive: true });
  canvas.addEventListener('touchmove', draw, { passive: true });
  canvas.addEventListener('touchend', stopDrawing);

  function isCanvasBlank(c) {
    const pixels = ctx.getImageData(0, 0, c.width, c.height).data;
    for (let i = 0; i < pixels.length; i += 4) {
      if (pixels[i + 3] !== 0) return false;
    }
    return true;
  }

  elClearSig.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    elSigError.classList.add('hidden');
  });

  elConfirmSig.addEventListener('click', () => {
    const t = translations[st.lang] || translations.de;
    
    if (isCanvasBlank(canvas)) {
      elSigError.textContent = t.errSig;
      elSigError.classList.remove('hidden');
      return;
    }

    const signatureData = canvas.toDataURL('image/png');

    const payload = {
      event: st.event,
      customEvent: st.customEvent,
      name: st.name,
      signature: signatureData
    };

    elConfirmSig.disabled = true;

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
    .then(() => {
      elSigError.classList.add('hidden');
      elSigFormWrapper.classList.add('hidden');
      elSuccessMessage.classList.remove('hidden');
    })
    .catch(err => {
      console.error('Chyba odesílání:', err);
      elSigError.textContent = "Fehler beim Speichern der Daten.";
      elSigError.classList.remove('hidden');
    })
    .finally(() => {
      elConfirmSig.disabled = false;
    });
  });

  render();
</script>
