<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Návštěvní test">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>PWA Test V2</title>
  <style>
    /* Styly pro horní bar s vlajkami */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .lang-picker {
      display: flex;
      gap: 8px;
    }
    .lang-btn {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 1.4rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.1s, border-color 0.2s;
    }
    .lang-btn:active {
      transform: scale(0.92);
    }
    .lang-btn.active {
      border-color: #38bdf8;
      background: #0f172a;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    /* Kreslicí plátno pro podpis */
    #sig-canvas {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      touch-action: none; /* Zabrání scrollování stránky na iPadu při kreslení */
      background: #ffffff;
      cursor: crosshair;
      width: 100%;
      max-width: 400px;
      height: 150px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header-bar">
    <h1 id="t-title" style="margin:0;">📖 Návštěvní kniha</h1>
    <div class="lang-picker">
      <button class="lang-btn" data-lang="cz" title="Čeština">🇨🇿</button>
      <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
      <button class="lang-btn" data-lang="de" title="Deutsch">🇩🇪</button>
      <button class="lang-btn" data-lang="ro" title="Română">🇷🇴</button>
    </div>
  </div>
  
  <div class="card">
    <label id="t-lbl-event" for="event">Událost</label>
    <select id="event">
      <option value="Zásilka" id="t-opt-shipment">Zásilka</option>
      <option value="Servis" id="t-opt-service">Servis</option>
      <option value="Abholer" id="t-opt-pickup">Odběr / Abholer</option>
      <option value="Návštěva" id="t-opt-visit">Návštěva</option>
    </select>
    
    <label id="t-lbl-name" for="name">Jméno</label>
    <input id="name" placeholder="...">
    
    <label id="t-lbl-note" for="note">Poznámka</label>
    <textarea id="note" rows="3" placeholder="..."></textarea>
    
    <div class="btn-group">
      <button id="reset-form" class="secondary">Resetovat formulář</button>
    </div>
  </div>

  <div class="card">
    <h3 id="t-h3-signature">Podpis</h3>
    <canvas id="sig-canvas"></canvas>
    <div class="btn-group">
      <button id="clear-sig" class="secondary">Vymazat podpis</button>
    </div>
  </div>

  <div class="card">
    <h3 id="t-h3-appstatus">Stav aplikace</h3>
    <p><span id="t-txt-clicks">Počet kliknutí:</span> <span id="count">0</span></p>
    <div class="btn-group">
      <button id="plus">+1 klik</button>
      <button id="reset-counter" class="secondary">Reset čítače</button>
    </div>
  </div>

  <div class="card">
    <h3 id="t-h3-testid">Testovací ID</h3>
    <p id="session"></p>
    <p id="saved"></p>
  </div>
</div>

<script>
  // --- Překladový slovník (i18n) ---
  const translations = {
    cz: {
      title: "📖 Návštěvní kniha – TEST V2",
      lblEvent: "Událost",
      optShipment: "Zásilka",
      optService: "Servis",
      optPickup: "Odběr / Abholer",
      optVisit: "Návštěva",
      lblName: "Jméno",
      phName: "Sem napiš jméno",
      lblNote: "Poznámka",
      phNote: "Rozpracovaný text...",
      btnResetForm: "Resetovat formulář",
      h3Sig: "Podpis",
      btnClearSig: "Vymazat podpis",
      h3AppStatus: "Stav aplikace",
      txtClicks: "Počet kliknutí:",
      btnPlus: "+1 klik",
      btnResetCounter: "Reset čítače",
      h3TestId: "Testovací ID",
      lblSaved: "Uloženo:"
    },
    en: {
      title: "📖 Visitor Logbook – TEST V2",
      lblEvent: "Event",
      optShipment: "Shipment",
      optService: "Service",
      optPickup: "Pickup",
      optVisit: "Visit",
      lblName: "Name",
      phName: "Enter name here",
      lblNote: "Note",
      phNote: "Draft text...",
      btnResetForm: "Reset Form",
      h3Sig: "Signature",
      btnClearSig: "Clear Signature",
      h3AppStatus: "App Status",
      txtClicks: "Click count:",
      btnPlus: "+1 click",
      btnResetCounter: "Reset Counter",
      h3TestId: "Test ID",
      lblSaved: "Saved:"
    },
    de: {
      title: "📖 Besucherbuch – TEST V2",
      lblEvent: "Ereignis",
      optShipment: "Lieferung",
      optService: "Service",
      optPickup: "Abholer",
      optVisit: "Besuch",
      lblName: "Name",
      phName: "Name hier eingeben",
      lblNote: "Notiz",
      phNote: "Entwurfstext...",
      btnResetForm: "Formular zurücksetzen",
      h3Sig: "Unterschrift",
      btnClearSig: "Unterschrift löschen",
      h3AppStatus: "App-Status",
      txtClicks: "Klickanzahl:",
      btnPlus: "+1 Klick",
      btnResetCounter: "Zähler zurücksetzen",
      h3TestId: "Test-ID",
      lblSaved: "Gespeichert:"
    },
    ro: {
      title: "📖 Registru Vizitatori – TEST V2",
      lblEvent: "Eveniment",
      optShipment: "Livrare",
      optService: "Service",
      optPickup: "Ridicare",
      optVisit: "Vizită",
      lblName: "Nume",
      phName: "Introduceți numele",
      lblNote: "Notă",
      phNote: "Text în lucru...",
      btnResetForm: "Resetează formularul",
      h3Sig: "Semnătură",
      btnClearSig: "Șterge semnătura",
      h3AppStatus: "Stare aplicație",
      txtClicks: "Număr de clicuri:",
      btnPlus: "+1 clic",
      btnResetCounter: "Resetează contorul",
      h3TestId: "ID Test",
      lblSaved: "Salvat:"
    }
  };

  // Načtení DOM prvků
  const elEvent = document.getElementById('event');
  const elName = document.getElementById('name');
  const elNote = document.getElementById('note');
  const elCount = document.getElementById('count');
  const elPlus = document.getElementById('plus');
  const elResetCounter = document.getElementById('reset-counter');
  const elResetForm = document.getElementById('reset-form');
  const elSession = document.getElementById('session');
  const elSaved = document.getElementById('saved');
  const canvas = document.getElementById('sig-canvas');
  const elClearSig = document.getElementById('clear-sig');
  const ctx = canvas.getContext('2d');

  const K = 'pwa-test-v2';
  let st = JSON.parse(localStorage.getItem(K) || JSON.stringify({
    count: 0,
    event: "Zásilka",
    name: "",
    note: "",
    lang: "cz",
    session: crypto.randomUUID()
  }));

  // Aktualizace jazyka v UI
  function applyLanguage(lang) {
    const t = translations[lang] || translations.cz;
    document.getElementById('t-title').textContent = t.title;
    document.getElementById('t-lbl-event').textContent = t.lblEvent;
    document.getElementById('t-opt-shipment').textContent = t.optShipment;
    document.getElementById('t-opt-service').textContent = t.optService;
    document.getElementById('t-opt-pickup').textContent = t.optPickup;
    document.getElementById('t-opt-visit').textContent = t.optVisit;
    document.getElementById('t-lbl-name').textContent = t.lblName;
    elName.placeholder = t.phName;
    document.getElementById('t-lbl-note').textContent = t.lblNote;
    elNote.placeholder = t.phNote;
    elResetForm.textContent = t.btnResetForm;
    document.getElementById('t-h3-signature').textContent = t.h3Sig;
    elClearSig.textContent = t.btnClearSig;
    document.getElementById('t-h3-appstatus').textContent = t.h3AppStatus;
    document.getElementById('t-txt-clicks').textContent = t.txtClicks;
    elPlus.textContent = t.btnPlus;
    elResetCounter.textContent = t.btnResetCounter;
    document.getElementById('t-h3-testid').textContent = t.h3TestId;

    // Zvýraznění aktivní vlajky
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
  }

  function render() {
    elEvent.value = st.event;
    elName.value = st.name;
    elNote.value = st.note;
    elCount.textContent = st.count;
    elSession.textContent = 'ID: ' + st.session;
    
    const t = translations[st.lang] || translations.cz;
    elSaved.textContent = t.lblSaved + ' ' + new Date().toLocaleTimeString();
    
    applyLanguage(st.lang);
    localStorage.setItem(K, JSON.stringify(st));
  }

  // Přepínání jazyků
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      st.lang = btn.dataset.lang;
      render();
    });
  });

  // Event Listenery formuláře
  [elEvent, elName, elNote].forEach(el => {
    el.addEventListener('input', e => {
      st[e.target.id] = e.target.value;
      render();
    });
  });

  // Tlačítko +1
  elPlus.addEventListener('click', () => {
    st.count++;
    render();
  });

  // Granulární resetování
  elResetCounter.addEventListener('click', () => {
    st.count = 0;
    render();
  });

  elResetForm.addEventListener('click', () => {
    st.event = "Zásilka";
    st.name = "";
    st.note = "";
    render();
  });

  // --- Kreslení podpisu (Touch + Mouse) ---
  let isDrawing = false;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#0f172a';
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    isDrawing = false;
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);

  canvas.addEventListener('touchstart', startDrawing, { passive: true });
  canvas.addEventListener('touchmove', draw, { passive: true });
  canvas.addEventListener('touchend', stopDrawing);

  elClearSig.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  // První vykreslení
  render();
</script>
</body>
</html>
