<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Návštěvní test">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>PWA Test V2</title>
  <style>
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .lang-picker {
      display: flex;
      gap: 8px;
    }
    .lang-btn {
      background: #1e293b;
      border: 1px solid #334155;
      font-size: 1.4rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.1s, border-color 0.2s;
    }
    .lang-btn:active {
      transform: scale(0.92);
    }
    .lang-btn.active {
      border-color: #38bdf8;
      background: #0f172a;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    #sig-canvas {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      touch-action: none;
      background: #ffffff;
      cursor: crosshair;
      width: 100%;
      max-width: 400px;
      height: 150px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .custom-option-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 12px;
    }
    .custom-option-group input {
      flex: 1;
    }

    .hidden {
      display: none !important;
    }

    .terms-card {
      max-height: 45vh;
      overflow-y: auto;
      line-height: 1.5;
      font-size: 0.9rem;
    }
    .terms-card ul {
      padding-left: 20px;
      margin: 10px 0;
    }
    .terms-card li {
      margin-bottom: 8px;
    }
    
    .declaration-text {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #334155;
      font-weight: 600;
      font-style: italic;
      color: #e2e8f0;
    }

    .sig-declaration {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 8px;
      line-height: 1.4;
    }

    /* Chybové stavy */
    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 8px;
      font-weight: 600;
    }
    .input-error {
      border: 2px solid #ef4444 !important;
    }

    /* Zelená fajfka pro úspěšné odeslání */
    .success-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background-color: #22c55e;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 12px;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header-bar">
    <h1 id="t-title" style="margin:0;">📖 Návštěvní kniha</h1>
    <div class="lang-picker">
      <button class="lang-btn" data-lang="de" title="Deutsch">🇩🇪</button>
      <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
      <button class="lang-btn" data-lang="cz" title="Čeština">🇨🇿</button>
      <button class="lang-btn" data-lang="ro" title="Română">🇷🇴</button>
    </div>
  </div>
  
  <!-- KARTA 1 -->
  <div id="step-one-container" class="card">
    <label id="t-lbl-event" for="event">Účel návštěvy</label>
    <select id="event">
      <option value="" id="t-opt-select">-- Vyberte účel návštěvy --</option>
      <option value="Zásilka" id="t-opt-shipment">Zásilka</option>
      <option value="Servis" id="t-opt-service">Servis</option>
      <option value="Abholer" id="t-opt-pickup">Odběr / Abholer</option>
      <option value="Návštěva" id="t-opt-visit">Návštěva</option>
      <option value="Jiná volba" id="t-opt-other">Jiná volba</option>
    </select>

    <div id="custom-event-container" class="custom-option-group hidden">
      <input id="custom-event" placeholder="Specifikujte účel návštěvy...">
      <button id="btn-save-custom" class="secondary" type="button">Uložit</button>
    </div>
    
    <label id="t-lbl-name" for="name">Jméno a příjmení</label>
    <input id="name" placeholder="...">
    
    <label id="t-lbl-note" for="note">Poznámka (volitelné)</label>
    <textarea id="note" rows="3" placeholder="..."></textarea>
    
    <div id="validation-error" class="error-msg hidden"></div>

    <div class="btn-group">
      <button id="reset-form" class="secondary">Resetovat formulář</button>
      <button id="btn-next">Dále</button>
    </div>
  </div>

  <!-- KARTA 2 -->
  <div id="step-two-container" class="hidden">
    
    <div class="card terms-card">
      <h3 id="t-h3-terms">Bezpečnostní pravidla pro pohyb na provozní ploše (Spedice EXPRESLog)</h3>
      <ul id="t-rules-list"></ul>
      <p id="t-declaration" class="declaration-text"></p>
    </div>

    <div class="card">
      <h3 id="t-h3-signature">Podpis</h3>
      
      <!-- Formulář s podpisem -->
      <div id="sig-form-wrapper">
        <canvas id="sig-canvas"></canvas>
        <p id="t-sig-declaration" class="sig-declaration"></p>
        <div id="sig-error" class="error-msg hidden"></div>
        <div class="btn-group">
          <button id="clear-sig" class="secondary">Vymazat podpis</button>
          <button id="confirm-sig">Odeslat a potvrdit</button>
        </div>
      </div>

      <!-- Zobrazí se po úspěšném odeslání -->
      <div id="success-message" class="success-box hidden">
        <div class="success-icon">✓</div>
        <h3 id="t-success-title" style="margin: 0 0 8px 0; color: #22c55e;">Děkujeme!</h3>
        <p id="t-success-text" style="margin: 0; color: #94a3b8; font-size: 0.9rem;"></p>
      </div>

    </div>

    <div class="card">
      <h3 id="t-h3-appstatus">Stav aplikace</h3>
      <p><span id="t-txt-clicks">Počet kliknutí:</span> <span id="count">0</span></p>
      <div class="btn-group">
        <button id="plus">+1 klik</button>
        <button id="reset-counter" class="secondary">Reset čítače</button>
      </div>
    </div>

    <div class="card">
      <h3 id="t-h3-testid">Testovací ID</h3>
      <p id="session"></p>
      <p id="saved"></p>
    </div>

  </div>
</div>

    document.getElementById('t-h3-terms').textContent = t.h3Terms;
    elRulesList.innerHTML = t.rules.map(r => `<li>${r}</li>`).join('');
    elDeclaration.textContent = t.declaration;

    document.getElementById('t-h3-signature').textContent = t.h3Sig;
    elSigDeclaration.textContent = t.sigDeclaration;
    elClearSig.textContent = t.btnClearSig;
    elConfirmSig.textContent = t.btnConfirmSig;
    document.getElementById('t-success-title').textContent = t.successTitle;
    document.getElementById('t-success-text').textContent = t.successText;

    document.getElementById('t-h3-appstatus').textContent = t.h3AppStatus;
    document.getElementById('t-txt-clicks').textContent = t.txtClicks;
    elPlus.textContent = t.btnPlus;
    elResetCounter.textContent = t.btnResetCounter;
    document.getElementById('t-h3-testid').textContent = t.h3TestId;

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
  }

  function render() {
    elEvent.value = st.event;
    elCustomEvent.value = st.customEvent || "";
    elName.value = st.name;
    elNote.value = st.note;
    elCount.textContent = st.count;
    elSession.textContent = 'ID: ' + st.session;
    
    if (st.event === "Jiná volba") {
      elCustomEventContainer.classList.remove('hidden');
    } else {
      elCustomEventContainer.classList.add('hidden');
    }

    const t = translations[st.lang] || translations.de;
    elSaved.textContent = t.lblSaved + ' ' + new Date().toLocaleTimeString();
    
    applyLanguage(st.lang);
    localStorage.setItem(K, JSON.stringify(st));
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      st.lang = btn.dataset.lang;
      render();
    });
  });

  elEvent.addEventListener('change', e => {
    st.event = e.target.value;
    if (st.event !== "Jiná volba") {
      elCustomEvent.classList.remove('input-error');
    }
    render();
  });

  elCustomEvent.addEventListener('input', e => {
    st.customEvent = e.target.value;
    render();
  });

  elBtnSaveCustom.addEventListener('click', () => {
    const t = translations[st.lang] || translations.de;
    if (elCustomEvent.value.trim() === "") {
      elCustomEvent.classList.add('input-error');
      elValError.textContent = t.errCustomEvent;
      elValError.classList.remove('hidden');
    } else {
      elCustomEvent.classList.remove('input-error');
      elValError.classList.add('hidden');
      render();
    }
  });

  [elName, elNote].forEach(el => {
    el.addEventListener('input', e => {
      st[e.target.id] = e.target.value;
      render();
    });
  });

  elPlus.addEventListener('click', () => {
    st.count++;
    render();
  });

  elResetCounter.addEventListener('click', () => {
    st.count = 0;
    render();
  });

  elResetForm.addEventListener('click', () => {
    st.event = "";
    st.customEvent = "";
    st.name = "";
    st.note = "";
    elValError.classList.add('hidden');
    elEvent.classList.remove('input-error');
    elCustomEvent.classList.remove('input-error');
    elName.classList.remove('input-error');
    elSigFormWrapper.classList.remove('hidden');
    elSuccessMessage.classList.add('hidden');
    render();
  });

  elBtnNext.addEventListener('click', () => {
    const t = translations[st.lang] || translations.de;
    
    let isEventValid = elEvent.value.trim() !== "";
    let isCustomValid = true;

    if (elEvent.value === "Jiná volba") {
      isCustomValid = elCustomEvent.value.trim() !== "";
    }

    const words = elName.value.trim().split(/\s+/).filter(w => w.length > 0);
    const isNameValid = words.length >= 2;

    elEvent.classList.remove('input-error');
    elCustomEvent.classList.remove('input-error');
    elName.classList.remove('input-error');
    elValError.classList.add('hidden');

    if (!isEventValid || !isCustomValid || !isNameValid) {
      if (!isEventValid) elEvent.classList.add('input-error');
      if (!isCustomValid) elCustomEvent.classList.add('input-error');
      if (!isNameValid) elName.classList.add('input-error');

      if (!isEventValid) {
        elValError.textContent = t.errSelect;
      } else if (!isCustomValid) {
        elValError.textContent = t.errCustomEvent;
      } else if (!isNameValid) {
        elValError.textContent = t.errName;
      }

      elValError.classList.remove('hidden');
      return;
    }

    elStepOne.classList.add('hidden');
    elStepTwo.classList.remove('hidden');
    
    resizeCanvas();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // --- Kreslení a Potvrzení podpisu ---
  let isDrawing = false;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    if(rect.width > 0) {
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';
    }
  }

  window.addEventListener('resize', resizeCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    elSigError.classList.add('hidden');
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    isDrawing = false;
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);

  canvas.addEventListener('touchstart', startDrawing, { passive: true });
  canvas.addEventListener('touchmove', draw, { passive: true });
  canvas.addEventListener('touchend', stopDrawing);

  function isCanvasBlank(c) {
    const pixels = ctx.getImageData(0, 0, c.width, c.height).data;
    for (let i = 0; i < pixels.length; i += 4) {
      if (pixels[i + 3] !== 0) return false;
    }
    return true;
  }

  elClearSig.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    elSigError.classList.add('hidden');
  });

  elConfirmSig.addEventListener('click', () => {
    const t = translations[st.lang] || translations.de;
    
    if (isCanvasBlank(canvas)) {
      elSigError.textContent = t.errSig;
      elSigError.classList.remove('hidden');
    } else {
      elSigError.classList.add('hidden');
      elSigFormWrapper.classList.add('hidden');
      elSuccessMessage.classList.remove('hidden');
    }
  });

  render();
</script>
</body>
</html>
