  <title>Besucherbuch</title>

<div class="wrap">

  <!-- LOGO A VLAJKY -->
  <div class="logo-container">
    <img src="Tradisa-logo-bl.png" alt="Tradisa Logo" class="brand-logo">
    
    <div class="lang-picker">
      <button class="lang-btn" data-lang="de" title="Deutsch"><img src="de.svg" alt="DE"></button>
      <button class="lang-btn" data-lang="en" title="English"><img src="gb.svg" alt="EN"></button>
      <button class="lang-btn" data-lang="es" title="Español"><img src="es.svg" alt="ES"></button>

      <button class="lang-btn" data-lang="ru" title="Русский"><img src="ru.svg" alt="RU"></button>
    </div>
  </div>
  
  <!-- KARTA 1: VSTUPNÍ FORMULÁŘ -->

    <div class="card">
      <label id="t-lbl-event" for="event">Besuchszweck</label>
      <select id="event">
        <option value="" id="t-opt-select">-- Besuchszweck auswählen --</option>
        <option value="Einlagerung" id="t-opt-einlagerung">Einlagerung</option>
        <option value="Auslagerung" id="t-opt-auslagerung">Auslagerung</option>
        <option value="Avis" id="t-opt-avis">Avis</option>
        <option value="Wareneingang" id="t-opt-wareneingang">Wareneingang</option>
        <option value="Besuch" id="t-opt-visit">Besuch</option>
        <option value="Service" id="t-opt-service">Service</option>
        <option value="Andere Option" id="t-opt-other">Andere Option</option>
      </select>

      <div id="custom-event-container" class="custom-option-group hidden">
        <input id="custom-event" type="text" placeholder="Geben Sie den Zweck ein...">
        <button id="btn-save-custom" class="secondary" type="button">Speichern</button>
      </div>
      
      <label id="t-lbl-name" for="name" style="margin-top: 12px; display: block;">Vor- und Nachname</label>
      <input id="name" placeholder="Max Mustermann" autocomplete="off">
      
      <div id="validation-error" class="error-msg hidden"></div>

      <div class="btn-group">
        <button id="reset-form" class="secondary" type="button">Formular zurücksetzen</button>
        <button id="btn-next" type="button">Weiter</button>
      </div>
    </div>

    <div class="footer-link-container">
      <a id="t-link-sheet-1" href="https://docs.google.com/spreadsheets/d/14JY3pVGkHyJmKMuELZCVU_PEHpvDgVXs5fPVw_OwZB8/edit?usp=sharing" target="_blank" rel="noopener" class="btn-link secondary">Besucherliste öffnen</a>
    </div>
  </div>

  <!-- KARTA 2: BEZPEČNOSTNÍ PROTOKOL -->
  <div id="step-two-container" class="hidden">
    
    <div class="card terms-card">
      <h3 id="t-h3-terms" style="margin-top:0; color:#34d399; text-align:center;">Safety Information & Instructions</h3>
      
      <div class="sec-section-title" id="t-sec-general">General Rules</div>
      <div class="icon-grid" id="t-general-icons"></div>

      <div class="sec-section-title" id="t-sec-ppe">Mandatory PPE (PSA)</div>
      <div class="icon-grid" id="t-ppe-icons"></div>

      <div class="sec-section-title" id="t-sec-loading">Loading / Unloading & VDI 2700</div>
      <ul class="rule-list" id="t-loading-rules"></ul>

      <div class="sec-section-title" id="t-sec-env">Environmental / Spill</div>
      <ul class="rule-list" id="t-env-rules"></ul>

      <div class="warning-box" id="t-warning-text"></div>

      <div class="sec-section-title" id="t-sec-emergency">Emergency Contacts</div>
      <div style="font-size: 0.85rem; font-weight: bold; text-align: center; color: #f87171; margin-top: 6px;" id="t-emergency-text"></div>

      <!-- ODKAZ NA PLNE ZNĚNÍ BEZPEČNOSTNÍCH PRAVIDEL -->
      <div style="margin-top: 16px; text-align: center;">
        <a id="t-link-full-rules" href="full_rules.pdf" target="_blank" rel="noopener" onclick="openPdf(event)" class="btn-link secondary">
          Odkaz na plné znění bezpečnostních pravidla
        </a>
      </div>
    </div>

    <!-- PODPISOVÁ ČÁST -->
    <div class="card">
      <h3 id="t-h3-signature" style="margin-top:0;">Unterschrift</h3>
      
      <div id="sig-form-wrapper">
        <p id="t-sig-declaration" class="sig-declaration"></p>
        <canvas id="sig-canvas"></canvas>
        <div id="sig-error" class="error-msg hidden"></div>
        <div class="btn-group">
          <button id="clear-sig" class="secondary" type="button">Unterschrift löschen</button>
          <button id="confirm-sig" type="button">Bestätigen & Absenden</button>
        </div>
      </div>

      <div id="success-message" class="success-box hidden">
        <div class="success-icon">✓</div>
        <h3 id="t-success-title" style="margin: 0 0 8px 0; color: #22c55e;">Vielen Dank!</h3>
        <p id="t-success-text" style="margin: 0 0 16px 0; color: #cbd5e1; font-size: 0.9rem;"></p>

      </div>

    </div>

  </div>
</div>

  const OTHER_OPTION_VALUES = new Set(["Andere Option", "Jiná volba", "Other option", "Otra opción", "Inna opcja", "Altă opțiune", "Другое"]);

  function isOtherOption(val) {
    return OTHER_OPTION_VALUES.has(val);

  function applyLanguage(lang) {
    const t = translations[lang] || translations.de;
    document.title = t.title;

  function render() {
    elEvent.value = st.event;
    elCustomEvent.value = st.customEvent || "";

  function resetFullForm() {
    st.event = "";
    st.customEvent = "";
    st.name = "";
    st.lang = "de";

    elValError.classList.add('hidden');
    elSigError.classList.add('hidden');
    elEvent.classList.remove('input-error');
    elCustomEvent.classList.remove('input-error');
    elName.classList.remove('input-error');

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasSignature = false;

    elSigFormWrapper.classList.remove('hidden');
    elSuccessMessage.classList.add('hidden');
    elStepTwo.classList.add('hidden');
    elStepOne.classList.remove('hidden');

    applyLanguage(st.lang);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });

    btn.addEventListener('click', () => {

    st.event = e.target.value;
    if (!isOtherOption(st.event)) {
      elCustomEvent.classList.remove('input-error');

  elCustomEvent.addEventListener('input', e => {
    st.customEvent = e.target.value;
    render();

    const t = translations[st.lang] || translations.de;
    if (elCustomEvent.value.trim() === "") {
      elCustomEvent.classList.add('input-error');
      elValError.textContent = t.errCustomEvent;
      elValError.classList.remove('hidden');
    } else {
      elCustomEvent.classList.remove('input-error');
      elValError.classList.add('hidden');
      render();
    }
  });

    st.name = e.target.value;
    render();

  elBtnNewVisitor.addEventListener('click', resetFullForm);

  elBtnNext.addEventListener('click', () => {
    const t = translations[st.lang] || translations.de;
    
    let isEventValid = elEvent.value.trim() !== "";
    let isCustomValid = true;

    if (isOtherOption(elEvent.value)) {
      isCustomValid = elCustomEvent.value.trim() !== "";
    }

    const words = elName.value.trim().split(/\s+/).filter(w => w.length > 0);
    const isNameValid = words.length >= 2;

    elEvent.classList.remove('input-error');
    elCustomEvent.classList.remove('input-error');
    elName.classList.remove('input-error');
    elValError.classList.add('hidden');

    if (!isEventValid || !isCustomValid || !isNameValid) {
      if (!isEventValid) elEvent.classList.add('input-error');
      if (!isCustomValid) elCustomEvent.classList.add('input-error');
      if (!isNameValid) elName.classList.add('input-error');

      if (!isEventValid) {
        elValError.textContent = t.errSelect;
      } else if (!isCustomValid) {
        elValError.textContent = t.errCustomEvent;
      } else if (!isNameValid) {
        elValError.textContent = t.errName;
      }

      elValError.classList.remove('hidden');
      return;
    }

    elStepOne.classList.add('hidden');
    elStepTwo.classList.remove('hidden');
    
    resizeCanvas();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  let isDrawing = false;
  let hasSignature = false;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    if (rect.width > 0) {
      const dpr = window.devicePixelRatio || 1;
      
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(canvas, 0, 0);

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      ctx.scale(dpr, dpr);
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#0f172a';

      ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
    }
  }

  window.addEventListener('resize', resizeCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    elSigError.classList.add('hidden');
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function openPdf(event) {
    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    if (isStandalone) {
      event.preventDefault();
      window.open('full_rules.pdf', '_system');
    }
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    hasSignature = true;
  }

  function stopDrawing() {
    isDrawing = false;
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);

  canvas.addEventListener('touchstart', startDrawing, { passive: true });
  canvas.addEventListener('touchmove', draw, { passive: true });
  canvas.addEventListener('touchend', stopDrawing);

  elClearSig.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasSignature = false;
    elSigError.classList.add('hidden');
  });

  elConfirmSig.addEventListener('click', () => {
    const t = translations[st.lang] || translations.de;

    if (!hasSignature) {
      elSigError.textContent = t.errSig;
      elSigError.classList.remove('hidden');
      return;
    }

    const signatureData = canvas.toDataURL('image/png');

    let finalEvent = st.event;
    if (isOtherOption(st.event) && st.customEvent.trim() !== "") {
      finalEvent = st.customEvent.trim();
    }

    const payload = {
      event: finalEvent,
      name: st.name,
      signature: signatureData
    };

    elConfirmSig.disabled = true;

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
    .then(() => {
      elSigError.classList.add('hidden');
      elSigFormWrapper.classList.add('hidden');
      elSuccessMessage.classList.remove('hidden');
    })
    .catch(err => {
      console.error('Chyba odesílání:', err);
      elSigError.textContent = t.errServer;
      elSigError.classList.remove('hidden');
    })
    .finally(() => {
      elConfirmSig.disabled = false;
    });
  });

  applyLanguage(st.lang);
  render();
</script>
</body>
</html>
