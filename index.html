<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Návštěvní test"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>PWA Test V2</title></head><body><div class="wrap"><h1>📖 Návštěvní kniha – TEST V2</h1><div class="status" id="mode">Načítám…</div><div class="card"><label>Událost</label><select id="event"><option>Zásilka</option><option>Servis</option><option>Abholer</option><option>Návštěva</option></select><label>Jméno</label><input id="name" placeholder="Sem napiš jméno"><label>Poznámka</label><textarea id="note" rows="3" placeholder="Rozpracovaný text..."></textarea></div><div class="card"><h3>Stav aplikace</h3><p>Počet kliknutí: <span id="count">0</span></p><button id="plus">+1 klik</button> <button id="clear" class="secondary">Reset</button></div><div class="card"><h3>Testovací ID</h3><p id="session"></p><p id="saved"></p></div></div><script>const s=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;mode.textContent=s?"✅ STANDALONE – vlastní okno":"⚠️ Běží v Safari";const K='pwa-test-v2';let st=JSON.parse(localStorage.getItem(K)||'{"count":0,"event":"Zásilka","name":"","note":"","session":"'+crypto.randomUUID()+'"}');function r(){event.value=st.event;name.value=st.name;note.value=st.note;count.textContent=st.count;session.textContent='ID: '+st.session;saved.textContent='Uloženo: '+new Date().toLocaleTimeString('cs-CZ');localStorage.setItem(K,JSON.stringify(st));}event.oninput=name.oninput=note.oninput=e=>{st[e.target.id]=e.target.value;r();};plus.onclick=()=>{st.count++;r();};clear.onclick=()=>{if(confirm("Resetovat test?")){localStorage.removeItem(K);location.reload();}};r();</script></body></html>
